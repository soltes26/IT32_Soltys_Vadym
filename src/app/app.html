<div class="container">
  <h1>Каталог товарів</h1>

  <div class="products-list">
    <div
      class="product-card"
      *ngFor="let product of products()"
      [ngClass]="getStatusClass(product.quantity)">

      <h3>{{ product.name }}</h3>
      <p>Ціна: {{ product.price }} грн</p>
      <p>Кількість: {{ product.quantity }}</p>

      <p *ngIf="product.quantity > 0" class="status available">Є в наявності</p>
      <p *ngIf="product.quantity === 0" class="status unavailable">Немає в наявності</p>

      <button (click)="removeProduct(product.id)" class="delete-btn">Видалити</button>
    </div>
  </div>

  <div class="counter">
    Всього товарів: {{ products().length }}
  </div>

  <div class="add-form">
    <h2>Додати новий товар</h2>

    <input
      type="text"
      placeholder="Назва товару"
      [(ngModel)]="newName" />

    <input
      type="number"
      placeholder="Ціна"
      [(ngModel)]="newPrice" />

    <input
      type="number"
      placeholder="Кількість"
      [(ngModel)]="newQuantity" />

    <button
      (click)="addProduct()"
      [disabled]="!newName.trim()">
      Додати товар
    </button>
  </div>
</div>
